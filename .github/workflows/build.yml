name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test PunisherBanna.slnx --configuration Release

      - name: Validate browser code
        run: node scripts/validate-web.js

      - name: Build package
        shell: pwsh
        run: ./build.ps1 -Configuration Release -SkipTests

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: PunisherBanna-1.0.0.0
          path: artifacts/PunisherBanna_1.0.0.0.zip
